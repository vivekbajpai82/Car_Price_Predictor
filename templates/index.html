<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Car Price Predictor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #4e54c8, #8f94fb);
      color: white;
      padding-top: 50px;
    }
    .card {
      padding: 30px;
      border-radius: 20px;
      background-color: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }
    h1 {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card mx-auto mt-5" style="max-width: 600px;">
      <h1 class="text-center mb-4">Car Price Prediction</h1>
      <form action="/predict" method="post">
        <div class="mb-3">
          <label class="form-label">Car Name</label>
          <input type="text" class="form-control" name="name" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Company</label>
          <input type="text" class="form-control" name="company" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Year</label>
          <input type="number" class="form-control" name="year" required>
        </div>
        <div class="mb-3">
          <label class="form-label">KMs Driven</label>
          <input type="number" class="form-control" name="kms_driven" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Fuel Type</label>
          <select class="form-select" name="fuel_type" required>
            <option value="Petrol">Petrol</option>
            <option value="Diesel">Diesel</option>
            <option value="CNG">CNG</option>
            <option value="LPG">LPG</option>
            <option value="Electric">Electric</option>
          </select>
        </div>
        <button type="submit" class="btn btn-light w-100">Predict Price</button>
      </form>
      {% if prediction_text %}
        <div class="alert alert-info text-center mt-4">{{ prediction_text }}</div>
      {% endif %}
    </div>
  </div>
</body>
</html>
